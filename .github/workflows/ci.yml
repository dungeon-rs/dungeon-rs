name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Denies warnings without invalidating the Bevy build cache the way RUSTFLAGS does.
  CARGO_BUILD_WARNINGS: deny

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          # `committed` lints every commit since the base branch, and the synthetic merge commit of a
          # pull request is not one of them.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - run: rustup toolchain install 1.96 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/ci
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-machete,cargo-about,typos,committed,taplo
      - run: just check
