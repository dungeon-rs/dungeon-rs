[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["tools"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "GPL-3.0-or-later"
license-file = "LICENSE"
readme = "README.md"
rust-version = "1.96"
publish = false
repository = "https://github.com/dungeon-rs/dungeon-rs"
authors = ["Wannes Gennar <info@dealloc.be>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
module_name_repetitions = "warn"
semicolon_if_nothing_returned = "warn"
# A bad file must become a report, never a crash.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Dispatch over Element kinds, Commands, and Project versions must name every variant.
wildcard_enum_match_arm = "deny"
allow_attributes_without_reason = "deny"
# Hash-map iteration order would make the same Project save differently between runs.
iter_over_hash_type = "deny"
# The terminal is written to only where logging does not exist yet; each such place says why.
print_stdout = "warn"
print_stderr = "warn"
# A Bevy system takes its parameters by value; the lint would fire on every system.
needless_pass_by_value = "allow"

[workspace.dependencies]
# Bevy is pinned to the release candidate until 0.20.0 ships. The umbrella crate is for the
# Editor and the Host only; every other crate uses the narrow crates below.
bevy = { version = "=0.20.0-rc.2", default-features = false, features = [
  "2d_bevy_render",
  "default_app",
  "std",
  "multi_threaded",
  "bevy_winit",
  "x11",
  "wayland",
  "gestures",
  "png",
  "jpeg",
  "webp",
  "libm",
] }
bevy_ecs = { version = "=0.20.0-rc.2", default-features = false, features = [
  "std",
  "bevy_reflect",
  "multi_threaded",
] }
bevy_app = { version = "=0.20.0-rc.2", default-features = false, features = [
  "std",
  "bevy_reflect",
] }
bevy_reflect = { version = "=0.20.0-rc.2", default-features = false, features = ["std", "glam"] }
# `libm` makes `bevy_math::ops` (and glam) compute the same bits on every machine.
bevy_math = { version = "=0.20.0-rc.2", default-features = false, features = [
  "std",
  "bevy_reflect",
  "serialize",
  "libm",
] }
bevy_asset = { version = "=0.20.0-rc.2", default-features = false, features = ["multi_threaded"] }
bevy_tasks = { version = "=0.20.0-rc.2", default-features = false }
bevy_image = { version = "=0.20.0-rc.2", default-features = false, features = [
  "bevy_reflect",
  "png",
  "jpeg",
  "webp",
] }
bevy_sprite = { version = "=0.20.0-rc.2", default-features = false }
bevy_sprite_render = { version = "=0.20.0-rc.2", default-features = false }
bevy_mesh = { version = "=0.20.0-rc.2", default-features = false }
bevy_render = { version = "=0.20.0-rc.2", default-features = false }
bevy_shader = { version = "=0.20.0-rc.2", default-features = false }
bevy_camera = { version = "=0.20.0-rc.2", default-features = false }
bevy_transform = { version = "=0.20.0-rc.2", default-features = false, features = [
  "std",
  "bevy-support",
  "bevy_reflect",
] }
bevy_color = { version = "=0.20.0-rc.2", default-features = false, features = [
  "std",
  "bevy_reflect",
] }
bevy_egui = { version = "=0.43.0-rc.1", default-features = false, features = [
  "default_fonts",
  "render",
] }
egui = "=0.36.2"
egui_dock = "=0.21.1"
rfd = "=0.17.2"
blake3 = "1.8"
caseless = "0.2"
directories = "6.0"
kurbo = { version = "0.13", default-features = false, features = ["std"] }
log = "0.4"
memchr = "2.8"
naga = { version = "30.0", default-features = false, features = ["wgsl-in"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "registry",
  "std",
] }
unicode-normalization = "0.1"
uuid = { version = "1.26", default-features = false, features = ["v4"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# We create a separate profile called 'fast' that disables all optimisation in favour of faster compilation for use in CI.
[profile.fast]
inherits = "dev"
opt-level = 0
codegen-units = 256
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
incremental = true

[profile.fast.package."*"]
opt-level = 0

# The search of the Asset library is timed by its tests against bounds meant for the dev build
# (our crates at opt-level 1, dependencies at 3), not for unoptimised code, so the search and the
# crates it scans and folds with are built as the dev build builds them.
[profile.fast.package.drs-catalog-engine]
opt-level = 1

[profile.fast.package.memchr]
opt-level = 3

[profile.fast.package.caseless]
opt-level = 3

[profile.fast.package.unicode-normalization]
opt-level = 3
