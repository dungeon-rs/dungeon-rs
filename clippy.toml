check-private-items = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
# A bad file must become a report, never a crash: a resource that is not there is reported
# through `World::get_resource`, never unwrapped by `World::resource`.
# Exports and golden images must be bit-identical across machines: fast-math and the platform's
# libm differ between them, so transcendental functions go through `bevy_math::ops`, in single and
# double precision alike.
# The working directory never matters to the editor: its own files go to its directories and its
# Bundled Files are found from the executable, so nothing may change it.
# A file the Author gets is as readable as any file: a temporary file is private to its owner by
# default, so a file written through one is created with `Builder` and the usual mode.
# The floor and the Walls' centre line must be the same chords, the same on every machine: lyon
# only fills the straight chords the shape Engine flattened, and never strokes, flattens a curve,
# or builds a round shape, since its joins, caps, arcs, and curve flattening follow its own
# tolerance and call the platform's `cos`, `sin`, and `acos`.
disallowed-types = [
  { path = "lyon_tessellation::StrokeTessellator", reason = "lyon's round joins and caps call the platform's trigonometry; the shape Engine strokes with its own code" },
]
