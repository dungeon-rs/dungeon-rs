[package]
name = "ci"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
cli-colors = "1.0.0"
cli-table = "0.5.0"
strum = { version = "0.28.0", features = ["derive"] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 0

[dev-dependencies]
tempfile = "3"
